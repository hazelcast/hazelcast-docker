name: Promote image from pre-prod to prod Docker registry (DockerHub or JFrog)
run-name: ${{ github.workflow }} (`${{ inputs.HZ_VERSION }}`@${{ inputs.ENVIRONMENT }})

on:
  # For debugging only
  workflow_dispatch:
    inputs:
      HZ_VERSION:
        description: 'Version of Hazelcast to build the image for, e.g. 5.1.1, 5.0.1'
        required: true
      JDKS:
        description: 'Supported JDKs - e.g. `[17, 21]`'
        required: true
      IS_LATEST_LTS:
        description: 'Is Latest LTS? e.g. `false`'
        required: true
      DEFAULT_JDK:
        description: 'The Java major version (e.g. `21`, `8`) used by default in the image'
        required: true
      DISTRIBUTION_CLASSIFIERS:
        required: true
      DISTRIBUTION_TYPES:
        required: true
      ENVIRONMENT:
        description: 'Environment to use'
        required: true
        type: environment
  workflow_call:
    inputs:
      HZ_VERSION:
        description: 'Version of Hazelcast to build the image for, e.g. 5.1.1, 5.0.1'
        required: true
        type: string
      JDKS:
        description: 'Supported JDKs - e.g. `[17, 21]`'
        required: true
        type: string
      IS_LATEST_LTS:
        description: 'Is Latest LTS? e.g. `false`'
        required: true
        type: string
      DEFAULT_JDK:
        description: 'The Java major version (e.g. `21`, `8`) used by default in the image'
        required: true
        type: string
      DISTRIBUTION_CLASSIFIERS:
        required: true
        type: string
      DISTRIBUTION_TYPES:
        required: true
        type: string
      ENVIRONMENT:
        description: 'Environment to use'
        required: true
        type: string

jobs:
  promote-docker-registry:
    environment: ${{ inputs.ENVIRONMENT }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    strategy:
      matrix:
        jdk: ${{ fromJSON(inputs.JDKS) }}
        classifier: ${{ fromJSON(inputs.DISTRIBUTION_CLASSIFIERS) }}
        distribution-type: ${{ fromJSON(inputs.DISTRIBUTION_TYPES) }}
    env:
      REMOTE_REGISTRY: ${{ (matrix.distribution-type.label == 'oss' && contains(inputs.HZ_VERSION, 'SNAPSHOT')) && 'docker.hazelcast.com/docker/hazelcast' || format('docker.io/{0}', vars.DOCKERHUB_ORGANIZATION) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: get-tags-to-push
        uses: ./.github/actions/get-tags-to-push
        with:
          hz-version: ${{ inputs.HZ_VERSION }}
          jdk: ${{ matrix.jdk }}
          default-jdk: ${{ inputs.DEFAULT_JDK }}
          classifier: ${{ matrix.classifier }}
          # LTS is implicitly EE only
          is-latest-lts: ${{ matrix.distribution-type.label == 'ee' && inputs.IS_LATEST_LTS == 'true' }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - uses: hazelcast/docker-actions/get-jfrog-credentials@master
        if: contains(env.REMOTE_REGISTRY, 'docker.hazelcast.com')
        id: authenticate-jfrog-write-dev-account
        with:
          aws-role-to-assume: ${{ vars.AWS_HAZELCAST_OIDC_GITHUB_ACTIONS_ROLE_ARN }}
          jfrog-oidc-provider-name: ${{ github.repository_owner }}-write-dev-account

      - uses: docker/login-action@v4
        if: steps.authenticate-jfrog-write-dev-account.outcome == 'success'
        with:
          registry: docker.hazelcast.com
          username: ${{ steps.authenticate-jfrog-write-dev-account.outputs.user }}
          password: ${{ steps.authenticate-jfrog-write-dev-account.outputs.token }}

      - name: Push image to remote registry
        run: |
          for tag in ${TAGS_TO_PUSH}
          do
            skopeo copy \
              --all \
              --retry-times 10 \
              docker://${{ vars.DOCKERHUB_ORGANIZATION }}/${{ vars.PREPROD_REGISTRY }}-${{ matrix.distribution-type.image-name }}:${{ steps.get-tags-to-push.outputs.primary-tag }} \
              docker://${REMOTE_REGISTRY}/${{ matrix.distribution-type.image-name }}:${tag}
          done
        env:
          TAGS_TO_PUSH: ${{ steps.get-tags-to-push.outputs.all-destination-tags }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Validate image signature
        timeout-minutes: 1
        run: |
          source /dev/stdin <<< "$(curl --fail --retry 5 --retry-all-errors --show-error --silent https://raw.githubusercontent.com/hazelcast/github-actions-common-scripts/main/logging.functions.sh)"

          # https://github.com/sigstore/cosign-installer#usage
          # Image signatures can take a couple of seconds to appear after the main image (suspect "oras cp --recursive" is not fully atomic), so poll for completion
          while ! cosign verify \
            --certificate-identity-regexp "${GITHUB_SERVER_URL//./\\.}/${GITHUB_REPOSITORY}/.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${REMOTE_REGISTRY}/${{ matrix.distribution-type.image-name }}:${{ steps.get-tags-to-push.outputs.primary-tag }}; do

            sleep 1
          done
