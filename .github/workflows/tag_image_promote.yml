name: Promote image from pre-prod to prod registries

on:
  # For debugging only
  workflow_dispatch:
jobs:
  promote-docker-registry:
    runs-on: ubuntu-latest
    steps:
      - run: exit 0

  promote-rhel:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: exit 0

  remove-preprod-tag:
    needs:
      - promote-docker-registry
      - promote-rhel
    runs-on: ubuntu-latest
    steps:
      - run: exit 0

  failure-notifications:
    name: Failure notification
    if: ${{ failure() }}
    needs:
      - remove-preprod-tag
    runs-on: ubuntu-latest
    steps:
      - run: exit 0
