name: Setup Docker
description: Configures runner with tools required to build (not just manage) Docker images 
inputs:
  platforms:
    description: Platforms to install (e.g., `arm64,riscv64,arm`)
    required: true
runs:
  using: "composite"
  steps:
    # Default GitHub runners have very little free disk space causing build failures
    # This operation can be intensive, so remove as little as possible to gain useful space
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
      with:
        preinstalled-runtimes: false
        android: false
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: false

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
      with:
        platforms: ${{ inputs.platforms }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        # Workaround "dial tcp: lookup registry on {ip}: no such host"
        # See example - https://docs.docker.com/build/ci/github-actions/local-registry/
        driver-opts: network=host
