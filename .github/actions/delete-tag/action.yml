name: Delete tags from registry
description: Delete a tag from a registry using regctl. Expects client to be already-authenticated

inputs:
  image_ref:
    description: "The image + tag to remove, e.g. my-image:1.2.3"
    required: true
runs:
  using: "composite"
  steps:
    - uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0

    - name: Delete tag
      shell: bash
      run: |
        # https://regclient.org/cli/regctl/tag/delete
        regctl tag delete \
          ${IMAGE_REF} \
          ${RUNNER_DEBUG:+--verbosity debug}
      env:
        IMAGE_REF: ${{ inputs.image_ref }}
